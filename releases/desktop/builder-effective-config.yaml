directories:
  output: releases/desktop
  buildResources: build
appId: in.vetally.backuppro
productName: VE Tally Backup
asar: true
asarUnpack:
  - '**/*.node'
  - node_modules/keytar/**
files:
  - filter:
      - desktop/**/*
      - ui/dist/**/*
      - bin/**/*
      - src/**/*
      - tools/auth.js
      - setup-auth.js
      - config/google-oauth-client.json
      - package.json
extraMetadata:
  main: desktop/main.js
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: VE-Tally-Backup-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VE Tally Backup
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
publish:
  - provider: github
    owner: vinodkumarsharma276
    repo: tally-backup
    releaseType: draft
electronVersion: 40.10.6
