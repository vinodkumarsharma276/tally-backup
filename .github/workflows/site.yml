name: Deploy site

# Builds the marketing site in site/ and publishes it to GitHub Pages.
# Enable once under Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'vite.site.config.js'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Only the site's build tooling is needed here, so skip the heavy native
      # deps (keytar/electron) that the desktop app pulls in.
      - name: Install build tooling
        run: npm install --no-save --no-audit --no-fund vite@^8.1.3 @vitejs/plugin-react@^6.0.3 react@^19.2.7 react-dom@^19.2.7
      - name: Build site
        env:
          # Project Pages serve from https://<user>.github.io/<repo>/
          SITE_BASE: /${{ github.event.repository.name }}/
          VITE_CONTACT_API: ${{ vars.CONTACT_API_URL }}
        run: npx vite build --config vite.site.config.js
      - name: Add SPA + Jekyll guards
        run: |
          touch site/dist/.nojekyll
          cp site/dist/index.html site/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
