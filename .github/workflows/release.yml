name: Release

# Two ways to release, both of which run the full test suite first:
#   1. Actions > Release > Run workflow, and enter a version (recommended).
#      CI bumps package.json, commits, tags and publishes.
#   2. Push a tag like v0.0.2 by hand.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.0.2 (no leading v)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install libsecret (keytar build dependency)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      # A failing suite stops the release before anything is tagged or built.
      - name: Run engine tests
        run: npm test
      - name: Run control plane tests
        working-directory: server
        run: npm ci --prefer-offline --no-audit --no-fund && npm test

  prepare:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # `main` allows no direct pushes and has no human bypass. The ruleset
          # grants bypass to deploy keys only, so the version bump is pushed over
          # SSH using the RELEASE_SSH_KEY secret (private half of the repo's
          # write-enabled deploy key). Without it, releases must be tagged by hand.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Resolve version and create tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"

            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists. Choose a new version, or delete the tag first."
              exit 1
            fi

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # The version may already match, e.g. re-releasing after a tag was
            # deleted. Only commit when something actually changed.
            CURRENT=$(node -p "require('./package.json').version")
            if [ "${CURRENT}" != "${VERSION}" ]; then
              npm version "${VERSION}" --no-git-tag-version
              git add package.json package-lock.json
              git commit -m "Release ${TAG}"
              git push origin main
            else
              echo "package.json is already ${VERSION}; tagging the current commit."
            fi

            git tag -a "${TAG}" -m "Backup Genie ${VERSION}"
            git push origin "${TAG}"

            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.ref_name }}"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ebargs: --win nsis
          - os: ubuntu-latest
            ebargs: --linux AppImage deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # keytar (OS credential vault) needs libsecret to build on Linux.
      - name: Install libsecret (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # The published Google OAuth client, so "Connect Google" works in the
      # shipped build. Without it Drive cannot be authorised.
      - name: Inject Google OAuth client
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
        run: |
          if [ -n "${GOOGLE_OAUTH_CLIENT}" ]; then
            printf '%s' "${GOOGLE_OAUTH_CLIENT}" > config/google-oauth-client.json
            if node -e "if(!require('./config/google-oauth-client.json').installed.client_id) process.exit(1)"; then
              # The client id is public (it appears in every auth URL); logging it
              # lets us confirm which client a build shipped with.
              node -e "console.log('OAuth client id:', require('./config/google-oauth-client.json').installed.client_id)"
            else
              echo "::error::GOOGLE_OAUTH_CLIENT must be JSON with installed.client_id (a Desktop app client)."
              exit 1
            fi
          else
            echo "::warning::GOOGLE_OAUTH_CLIENT secret is not set; Connect Google will fail in this build."
          fi

      - name: Build UI
        run: npm run build:ui

      - name: Build installers
        run: npx electron-builder ${{ matrix.ebargs }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Windows code signing (set these repo secrets to enable):
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            releases/desktop/Backup-Genie-Setup-*.exe
            releases/desktop/Backup-Genie-Setup-*.exe.blockmap
            releases/desktop/Backup-Genie-*.AppImage
            releases/desktop/Backup-Genie-*.deb
            releases/desktop/latest.yml
            releases/desktop/latest-linux.yml

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # A copy with a fixed filename, so one permanent download link can be
      # given to customers instead of a new URL for every release.
      - name: Add stable-named installer
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(find dist -name 'Backup-Genie-Setup-*.exe' | head -n1)
          if [ -n "${EXE}" ]; then
            cp "${EXE}" "dist/Backup-Genie-Setup.exe"
            echo "Stable copy: dist/Backup-Genie-Setup.exe"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: dist/**/*
